      .st0 {
        fill: #e2e2e2;
        mix-blend-mode: multiply;
      }

      .st1 {
        isolation: isolate;
      }

      .st2 {
        fill: #ffffff;
      }

      .st3 {
        fill: #797979;
      }
    </style>
